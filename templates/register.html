{% extends "base.html" %}
{% block title %}Register - Rocket Data System{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Register</h2>
    <form method="POST">
        <div class="form-group">
            <label for="username">Username <span style="color: #ff4081;">*</span></label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="email">Email <span style="color: #ff4081;">*</span></label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password <span style="color: #ff4081;">*</span></label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
