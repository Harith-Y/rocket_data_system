{% extends "base.html" %}
{% block title %}Submit Data - Rocket Data System{% endblock %}
{% block content %}
<div class="form-container">
    <h2>Submit Rocket Data</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Rocket Name <span style="color: #ff4081;">*</span></label>
            <input type="text" id="name" name="name" required placeholder="e.g., Falcon 9">
        </div>
        <div class="form-group">
            <label for="type">Type</label>
            <input type="text" id="type" name="type" placeholder="e.g., Heavy Lift">
        </div>
        <div class="form-group">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" placeholder="e.g., USA">
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <input type="text" id="status" name="status" placeholder="e.g., Active">
        </div>
        <div class="form-group">
            <label for="image">Image (PNG, JPG, JPEG, GIF, optional)</label>
            <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/jpg,image/gif">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5" placeholder="Describe the rocket..."></textarea>
        </div>
        <button type="submit" class="btn">Submit</button>
    </form>
</div>
{% endblock %}
